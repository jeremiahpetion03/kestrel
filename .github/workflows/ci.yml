name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest
      - name: Tests (equivalence, memory accounting, quantization bounds, reproducibility)
        run: pytest -v
      - name: End-to-end smoke run on real TinyShakespeare
        run: |
          python -m kestrel.train --steps 200 --n-layer 2 --d-model 64 --block-size 64 \
            --batch 16 --eval-every 100 --out smoke
          python -m kestrel.bench --run smoke --repeats 3 --batch 16
          python -m kestrel.report --run smoke --out smoke/RESULTS.md
          cat smoke/RESULTS.md
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-results-py${{ matrix.python-version }}
          path: |
            smoke/*.json
            smoke/*.jsonl
            smoke/RESULTS.md
            smoke/sample.txt
